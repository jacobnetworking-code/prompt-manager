<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Prompt Manager"><meta name="theme-color" content="#111111"><title>Prompt Manager</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body><div class="app"><header><div><small>PERSONAL ALPHA</small><h1>Prompt Manager</h1></div><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></header><main><section class="hero"><h2>Keep the prompts<br>worth using.</h2><p>Capture useful prompts and find them again when you need them.</p><button id="open">＋ Import prompt</button></section><section class="library"><div class="heading"><div><small>LIBRARY</small><h3>Your prompts</h3></div><span id="count">0</span></div><input id="search" type="search" placeholder="Search your prompts…"><div id="empty" class="empty">✦<strong>Your library is empty</strong><span>Import the first prompt you want to keep.</span></div><div id="list"></div></section></main></div><dialog id="dialog"><form id="form"><div class="sheethead"><h3>Import prompt</h3><button type="button" id="close" class="round">×</button></div><label>Title <em>optional</em><input id="title" maxlength="120" placeholder="e.g. Landing page critique"></label><label>Prompt<textarea id="prompt" required placeholder="Paste the prompt here…"></textarea></label><label>Source URL <em>optional</em><input id="source" type="url" placeholder="https://x.com/…"></label><button class="full" type="submit">Save to Library</button></form></dialog><div id="toast"></div><script src="./app.js"></script></body></html>
