<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><title>Shared Prompt — Prompt Manager</title>
<meta name="description" content="A prompt shared via Prompt Manager">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Prompt Manager">
<meta property="og:title" content="Shared Prompt — Prompt Manager">
<meta property="og:description" content="Open this shared prompt in Prompt Manager">
<meta property="og:image" content="https://jacobnetworking-code.github.io/prompt-manager/share-preview-200.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="200"><meta property="og:image:height" content="200">
<meta name="twitter:card" content="summary"><meta name="twitter:image" content="https://jacobnetworking-code.github.io/prompt-manager/share-preview-200.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../ui-refine.css"><link rel="stylesheet" href="./share.css"><link rel="stylesheet" href="./share-m1.6.6.18.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="pm-share-page">
<main class="pm-share-shell">
<header class="pm-share-brand">
  <div class="pm-share-brand-left"><div class="mark">{ }</div><strong>Prompt Manager</strong><span class="alpha-badge">ALPHA</span></div>
  <div class="pm-share-language">
    <button id="shareLanguageButton" class="pm-share-language-button" type="button" aria-label="Language" aria-expanded="false"><span id="shareLanguageFlag">🇺🇸</span></button>
    <div id="shareLanguageMenu" class="pm-share-language-menu" hidden>
      <button type="button" data-share-lang="en" aria-label="English" title="English">🇺🇸</button>
      <button type="button" data-share-lang="es" aria-label="Español" title="Español">🇪🇸</button>
      <button type="button" data-share-lang="sr" aria-label="Srpski" title="Srpski">🇷🇸</button>
    </div>
  </div>
</header>
<section id="shareLoading" class="pm-share-state">Loading prompt…</section>
<section id="shareError" class="pm-share-state" hidden>This shared prompt is unavailable.</section>
<article id="shareCard" class="pm-public-card" hidden><button id="shareClose" class="pm-share-close" hidden aria-label="Close">×</button>
<div class="badges" id="shareBadges"></div><h1 id="shareTitle"></h1>
<div class="pm-public-prompt">
<div id="sharePreviewLabel" class="pm-public-label">Prompt Preview</div>
<pre id="shareTeaser"></pre>
<div id="shareLocked" class="pm-share-lock"><div class="pm-blur-lines"></div><div class="pm-lock-copy"><span>🔒</span><strong id="shareUnlockTitle">Unlock this prompt free</strong><small id="shareUnlockCopy">Sign in to see the full prompt and save it.</small><button id="shareGoogle">Continue with Google</button><button id="shareEmail">Continue with email</button></div></div>
<pre id="shareFull" hidden></pre>
</div>
<div id="shareVia" class="pm-shared-via">{ } Shared via Prompt Manager</div>
</article>
</main>
<script src="./share.js"></script>
</body></html>
